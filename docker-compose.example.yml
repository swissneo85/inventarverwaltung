# ============================================
# Inventarverwaltung - Docker Compose Vorlage
#
# VORLAGE für eigenes Self-Hosting.
# Nicht für das Buettler.org-Deployment bestimmt –
# massgebliche Datei dafür: deploy/docker-compose.yml
#
# Verwendung:
#   1. Diese Datei nach docker-compose.yml kopieren
#   2. APP_KEY generieren: openssl rand -base64 32
#   3. APP_URL auf deine Domain/IP setzen
#   4. docker compose up -d
# ============================================

services:
  inventarverwaltung:
    image: ghcr.io/swissneo85/inventarverwaltung:latest
    container_name: inventarverwaltung
    restart: unless-stopped
    ports:
      - "${PORT:-3004}:80"
    volumes:
      - ./data:/app/data
      - ./storage:/var/www/html/storage
    environment:
      - APP_NAME=Inventarverwaltung
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=false
      - APP_URL=${APP_URL:-http://localhost:3004}

      # SQLite (kein separater Datenbankserver nötig)
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/app/data/database.sqlite

      - SESSION_DRIVER=file
      - SESSION_LIFETIME=120
      - CACHE_DRIVER=file
      - QUEUE_CONNECTION=sync
      - LOG_CHANNEL=errorlog
      - LOG_LEVEL=warning

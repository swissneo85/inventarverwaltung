services:
  inventarverwaltung:
    image: ghcr.io/swissneo85/inventarverwaltung:hostinger
    container_name: inventarverwaltung
    restart: unless-stopped
    ports:
      - "8080:80"
    # /mnt/nas-inventar ist ein NFS-Mount (Synology-NAS) auf dem Host und muss
    # auf jedem Deployment-Ziel eingerichtet sein, bevor der Container gestartet wird.
    volumes:
      - ./data:/app/data
      - ./storage:/var/www/html/storage
      - /mnt/nas-inventar/images:/var/www/html/storage/app/public/images
      - /mnt/nas-inventar/documents:/var/www/html/storage/app/public/documents
    environment:
      - APP_KEY=<HIER_ECHTEN_KEY_EINTRAGEN>
      - APP_NAME=Inventarverwaltung
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://inventar.peterb.diskstation.me
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/app/data/database.sqlite
      - SESSION_DRIVER=file
      - SESSION_LIFETIME=120
      - CACHE_DRIVER=file
      - QUEUE_CONNECTION=sync
      - LOG_CHANNEL=errorlog
      - LOG_LEVEL=warning
